name: Update news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - run: node scripts/publish-to-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: news-media
      - run: node scripts/build-article-pages.mjs
        env:
          SITE_URL: https://haruna-report.vercel.app
      - run: node scripts/build-sitemap.mjs
        env:
          SITE_URL: https://haruna-report.vercel.app
      - run: |
          git config user.name "haruna-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json articles sitemap.xml robots.txt og-default.svg
          git diff --staged --quiet || (git commit -m "Update news" && git push)
