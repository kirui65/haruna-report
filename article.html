<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HARUNA REPORT</title><style>:root{--bg:#faf8f4;--card:#fff;--ink:#16181a;--muted:#6b7075;--green:#0a6b3d;--red:#bb1a1a;--line:#e4e0d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:0 18px}header{border-bottom:4px solid var(--ink);padding:18px 0 12px}a{color:var(--green)}.brand{font:800 30px Georgia,serif;letter-spacing:.04em}.brand span{color:var(--red)}.back{display:inline-block;margin:24px 0 12px}.meta{color:var(--muted);font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 13px;font:600 13px inherit;cursor:pointer}.btn:hover,.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.hero{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:12px 0 24px}.story p{margin:0 0 18px}.summary-label{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:8px 0}.video{width:100%;border-radius:12px;margin:12px 0 24px}.related{border-top:1px solid var(--line);margin-top:30px;padding-top:18px}.related h2{font:700 24px Georgia,serif}.related a{display:block;border-bottom:1px solid var(--line);padding:10px 0;text-decoration:none}.empty{padding:60px 0;text-align:center;color:var(--muted)}</style></head><body><header><div class="wrap"><a class="brand" href="index.html">HARUNA <span>REPORT</span></a></div></header><main class="wrap" id="app"><div class="empty">Loading article…</div></main><script>
const app=document.getElementById('app'),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),link=new URLSearchParams(location.search).get('link');fetch('news.json?'+Date.now()).then(r=>r.json()).then(d=>{const all=d.categories.flatMap(c=>c.items),a=all.find(i=>i.link===link||i.canonicalUrl===link);if(!a){app.innerHTML='<div class="empty">Article not found. <a href="index.html">Back to headlines</a></div>';return}const pageUrl=location.href,media=(a.media||[]).map(m=>m.type==='video'?`<video class="video" controls src="${esc(m.url)}"></video>`:`<img class="hero" src="${esc(m.url)}" alt="${esc(a.title)}">`).join(''),body=(a.content||[]).map(p=>`<p>${esc(p)}</p>`).join(''),summary=body||`<div class="summary-label">News summary</div><p>${esc(a.description||'The publisher has not supplied an article extract yet. Use the source link below to read the full permitted article.')}</p>`,related=all.filter(i=>i!==a&&i.source===a.source).slice(0,4).map(i=>`<a href="article.html?link=${encodeURIComponent(i.link)}">${esc(i.title)}</a>`).join('');app.innerHTML=`<a class="back" href="index.html">← Back to headlines</a><div class="meta"><b>${esc(a.source)}</b> · ${new Date(a.date).toLocaleString('en-KE')}</div><h1>${esc(a.title)}</h1><div class="actions"><button class="btn primary" id="share">↗ Share</button><button class="btn" id="copy">▣ Copy link</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(a.title+' '+pageUrl)}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">Facebook</a><a class="btn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(a.title)}&url=${encodeURIComponent(pageUrl)}" target="_blank" rel="noopener">X</a><button class="btn" id="save">♡ Save</button><button class="btn" onclick="print()">⎙ Print</button></div>${media}<div class="story">${summary}</div><p class="meta">Source: <a href="${esc(a.canonicalUrl||a.sourceUrl||a.link)}" target="_blank" rel="noopener">${esc(a.source)}</a></p>${related?`<section class="related"><h2>More from ${esc(a.source)}</h2>${related}</section>`:''}`;document.getElementById('share').onclick=async()=>{if(navigator.share)await navigator.share({title:a.title,url:pageUrl});else{await navigator.clipboard.writeText(pageUrl);alert('Article link copied.')}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(pageUrl);document.getElementById('copy').textContent='Copied ✓'};document.getElementById('save').onclick=()=>{const s=new Set(JSON.parse(localStorage.getItem('haruna-saved')||'[]')),key=a.id||a.link;s.has(key)?s.delete(key):s.add(key);localStorage.setItem('haruna-saved',JSON.stringify([...s]));document.getElementById('save').textContent=s.has(key)?'♥ Saved':'♡ Save'}}).catch(()=>app.innerHTML='<div class="empty">Could not load this article.</div>');</script></body></html>
