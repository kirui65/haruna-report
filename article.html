<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARUNA REPORT</title><style>:root{--bg:#faf8f4;--card:#fff;--ink:#16181a;--muted:#6b7075;--green:#0a6b3d;--red:#bb1a1a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:0 18px}header{border-bottom:4px solid var(--ink);padding:18px 0 12px}a{color:var(--green)}.brand{font:800 30px Georgia,serif;letter-spacing:.04em}.brand span{color:var(--red)}.back{display:inline-block;margin:24px 0 12px}.meta{color:var(--muted);font-size:14px}h1{font:700 clamp(28px,6vw,48px)/1.15 Georgia,serif;margin:12px 0}.hero{width:100%;max-height:480px;object-fit:cover;border-radius:12px;margin:12px 0 24px}.story p{margin:0 0 18px}.video{width:100%;border-radius:12px;margin:12px 0 24px}.empty{padding:60px 0;text-align:center;color:var(--muted)}</style></head>
<body><header><div class="wrap"><a class="brand" href="index.html">HARUNA <span>REPORT</span></a></div></header><main class="wrap" id="app"><div class="empty">Loading article…</div></main><script>
const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=new URLSearchParams(location.search).get('link');
fetch('news.json?'+Date.now()).then(r=>r.json()).then(d=>{const a=d.categories.flatMap(c=>c.items).find(i=>i.link===link||i.canonicalUrl===link);if(!a){app.innerHTML='<div class="empty">Article not found. <a href="index.html">Back to headlines</a></div>';return}const media=(a.media||[]).map(m=>m.type==='video'?`<video class="video" controls src="${esc(m.url)}"></video>`:`<img class="hero" src="${esc(m.url)}" alt="${esc(a.title)}">`).join('');const body=(a.content||[]).map(p=>`<p>${esc(p)}</p>`).join('');app.innerHTML=`<a class="back" href="index.html">← Back to headlines</a><div class="meta"><b>${esc(a.source)}</b> · ${new Date(a.date).toLocaleString('en-KE')}</div><h1>${esc(a.title)}</h1>${media}<div class="story">${body||`<p>${esc(a.description||'The full article is not available yet.')}</p>`}</div><p class="meta">Source: <a href="${esc(a.canonicalUrl||a.link)}" target="_blank" rel="noopener">${esc(a.source)}</a></p>`}).catch(()=>app.innerHTML='<div class="empty">Could not load this article.</div>');
</script></body></html>
